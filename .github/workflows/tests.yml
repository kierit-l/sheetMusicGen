name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run pytest
